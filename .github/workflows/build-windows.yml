name: Build Windows exe

# Manual only, on purpose. Building the app takes longer and produces a
# large file, unlike the plain test run in tests.yml, so this should only
# run when someone actually wants a fresh exe, not on every single push.
# Start it from the Actions tab on GitHub, or with:
#   gh workflow run build-windows.yml
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r "ESPI Full Algorithm/requirements.txt"

      - name: Install PyInstaller and vendored vmbpy (Allied Vision bindings)
        run: pip install -r packaging/requirements-build-windows.txt

      - name: Build ESPI.exe
        # --icon must be an absolute path. A relative one here broke a real
        # build: combining a custom --specpath with a relative --icon makes
        # PyInstaller re-resolve the icon path against the specpath folder
        # instead of the working directory, doubling "packaging" into
        # packaging\spec\packaging\assets\logo.ico, which does not exist.
        # ${{ github.workspace }} is the checked-out repo root, an absolute
        # path GitHub Actions always provides, sidestepping this entirely
        # the same way "$(pwd)/..." does for the local Mac build.
        #
        # --collect-submodules pyvisa_py: a real bug, found on a real
        # downloaded Mac build, not theoretical. pyvisa finds its "@py"
        # backend (pyvisa_py) by scanning installed top level packages at
        # runtime with pkgutil.iter_modules() for anything named
        # "pyvisa_*" (pyvisa.highlevel.list_backends()), not through a
        # plain `import pyvisa_py` statement anywhere in this project's own
        # code. PyInstaller's static analysis only follows real import
        # statements, so without this flag it never bundles pyvisa_py, and
        # the packaged app fails with "Wrapper not found: No package named
        # pyvisa_py" the moment Scan Mode tries to reach the signal
        # generator, while Monitor Mode (which never touches pyvisa) works
        # fine, exactly the shape of bug a hidden, dynamically discovered
        # import causes. No PyInstaller hook already covers this
        # (confirmed by checking directly: nothing for pyvisa_py in either
        # PyInstaller's own hooks or _pyinstaller_hooks_contrib), and
        # pyvisa_py is pure Python with no data files, so listing every
        # submodule as a hidden import is the whole fix; no
        # --collect-data needed alongside it.
        #
        # --add-data "...\espi_app\logo.svg;espi_app": another real bug,
        # found while fixing a report that the Windows taskbar icon did
        # not show while the app was open. logo.svg is not a .py file, so
        # PyInstaller's import-following analysis never bundles it on its
        # own; without this flag, ESPILogo (the on-screen logo on the
        # landing page and every dashboard title bar) silently renders
        # blank in the packaged app, since it looks for logo.svg at a path
        # that does not exist inside the frozen exe. The "espi_app"
        # destination after the semicolon must match what
        # espi_app/logo.py's _resource_dir() looks for under
        # sys._MEIPASS at runtime. Semicolon, not colon, is PyInstaller's
        # --add-data separator specifically on Windows.
        run: |
          pyinstaller --onefile --windowed --name ESPI --icon "${{ github.workspace }}\packaging\assets\logo.ico" --paths "ESPI Full Algorithm" --collect-submodules pyvisa_py --add-data "${{ github.workspace }}\espi_app\logo.svg;espi_app" --distpath packaging\dist --workpath packaging\build --specpath packaging\spec espi_app\main.py

      - name: Smoke-test that ESPI.exe actually launches
        # This step exists because of a real bug found on the Mac build:
        # every previous verification only ever ran the freshly built app
        # locally, right after building, which passed every time even
        # though the Mac app's code signature was actually broken the
        # whole time. The break only showed up once the app was
        # downloaded through a browser. See
        # .claude/pyinstaller-packaging-plan.md for the full story.
        #
        # This step does NOT close that exact gap for Windows: it cannot
        # simulate a real browser download (the Mark-of-the-Web zone
        # identifier that triggers SmartScreen), and it cannot click
        # through a real SmartScreen prompt, since this runner has no
        # display and no human. What it DOES catch, on a real Windows
        # machine (this CI runner, not the Mac this project is otherwise
        # built and tested on): the whole class of "Qt platform plugin
        # windows could not be loaded", missing-DLL, or import-time crash
        # bugs that PyInstaller's own build step happily finishes with
        # exit code 0 even when the resulting exe cannot actually start.
        # If ESPI.exe is still running a few seconds after launch, with
        # no window ever needing to appear (QT_QPA_PLATFORM=offscreen),
        # it did not crash on startup. If it exits on its own before
        # that, the build is stopped here and never uploaded, the same
        # "do not ship what was never verified" rule the Mac build script
        # (packaging/build_mac.sh) now follows for its own signature
        # check.
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath "packaging\dist\ESPI.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Error "ESPI.exe exited on its own within 8 seconds (exit code $($proc.ExitCode)). It likely crashed on startup instead of showing the landing page. Since this build uses --windowed, no console traceback is visible here; rebuild locally without --windowed to see the real Python error."
            exit 1
          }
          Write-Host "ESPI.exe is still running after 8 seconds (PID $($proc.Id)), no startup crash. Stopping it now."
          Stop-Process -Id $proc.Id -Force

      - name: Upload ESPI.exe
        uses: actions/upload-artifact@v4
        with:
          name: ESPI-windows
          path: packaging/dist/ESPI.exe

# Allied Vision (vmbpy) support: this build DOES include it, using the
# vmbpy 1.2.2 wheel vendored into packaging/vendor/ specifically for
# Windows (Mac builds use the older 1.0.4 instead, see
# requirements-build-mac.txt). That wheel only carries vmbpy's Python
# bindings, not the actual Vimba X Runtime (drivers, GenTL producer
# files) real camera hardware needs, and vmbpy checks that native
# runtime's version the moment it is imported. Anyone with an actual
# Allied Vision camera still has to install the real Vimba X SDK on
# their own Windows machine separately (specifically one providing
# native runtime 1.3.1, to match this vmbpy version), same as Basler's
# pylon Runtime needing its own separate install. See
# packaging/vendor/README.md, packaging/INSTALL.md, and
# .claude/pyinstaller-packaging-plan.md.
#
# What this workflow covers now, and what it still does NOT cover:
#   The "Smoke-test" step above proves the exe actually launches and stays
#   running on a real Windows machine (this CI runner), not just that
#   PyInstaller finished without errors. It does NOT prove a real user's
#   downloaded copy gets past Windows SmartScreen (that only triggers on a
#   file carrying the Mark-of-the-Web zone identifier a real browser
#   download adds, which this runner never adds), and it obviously cannot
#   test real camera or signal generator hardware, since none is attached
#   to this runner. Download the exe from this workflow's own Artifacts
#   section and run packaging/windows_diagnostic.py next to it to check
#   the hardware-dependent parts, and see
#   .claude/pyinstaller-packaging-plan.md for the full story, including
#   the Mac code-signing bug that made "only ever tested the freshly
#   built copy locally" a real, shipped problem once already.
